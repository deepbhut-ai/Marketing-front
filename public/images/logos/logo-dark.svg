<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 76" width="380" height="76">
  <!-- icon mark: rounded square with M, dot, and sound arcs -->
  <g transform="translate(0, 0)">
    <!-- rounded square background -->
    <rect x="0" y="0" width="68" height="68" rx="18" ry="18" fill="#5B4DFF"/>

    <!-- white M -->
    <path d="M21 50 L21 22 L34 35 L47 22 L47 50"
          fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- orange dot -->
    <circle cx="50.5" cy="20.5" r="5" fill="#ff6b35"/>

    <!-- sound arcs -->
    <path d="M58 15 Q65 25 58 35" fill="none" stroke="#ff6b35" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M63 9 Q72 25 63 41" fill="none" stroke="#ff9f7a" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
  </g>

  <!-- wordmark: marketingira -->
  <text x="82" y="43" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="30" font-weight="800" letter-spacing="-0.5">
    <tspan fill="#f9fafb">marketing</tspan>
    <tspan fill="#ff6b35">ira</tspan>
  </text>

  <!-- tagline -->
  <text x="83" y="60" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" letter-spacing="1.5" fill="#9ca3af">SOCIAL AUTO-POSTING</text>
</svg>