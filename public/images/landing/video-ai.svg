<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" role="img" aria-label="AI video generation for social media">
  <defs>
    <linearGradient id="viCta" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8457f6"/>
      <stop offset="100%" stop-color="#ea5fb0"/>
    </linearGradient>
    <linearGradient id="viTeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2fd6b9"/>
      <stop offset="100%" stop-color="#8457f6"/>
    </linearGradient>
    <linearGradient id="viFilm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8457f6"/>
      <stop offset="100%" stop-color="#2fd6b9"/>
    </linearGradient>
    <filter id="viGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- main screen -->
  <rect x="120" y="50" width="400" height="260" rx="20" fill="#111a2e" stroke="#223049" stroke-width="2"/>
  <rect x="120" y="50" width="400" height="36" rx="20" fill="#161f35"/>
  <rect x="120" y="72" width="400" height="14" fill="#161f35"/>
  <circle cx="148" cy="68" r="7" fill="#f4485f"/>
  <circle cx="170" cy="68" r="7" fill="#facc15"/>
  <circle cx="192" cy="68" r="7" fill="#2fd6b9"/>

  <!-- video preview -->
  <rect x="150" y="100" width="340" height="180" rx="12" fill="#161f35"/>
  <rect x="200" y="130" width="240" height="120" rx="8" fill="url(#viFilm)" opacity="0.2"/>
  <!-- abstract mountains / scene -->
  <polygon points="210,240 250,180 290,210 330,160 370,200 410,170 430,240" fill="url(#viCta)" opacity="0.6"/>
  <polygon points="230,240 270,200 310,220 350,190 390,210 420,240" fill="#ea5fb0" opacity="0.35"/>

  <!-- play button -->
  <circle cx="320" cy="190" r="30" fill="url(#viCta)" filter="url(#viGlow)" opacity="0.95"/>
  <polygon points="312,178 312,202 336,190" fill="#fff"/>

  <!-- timeline -->
  <rect x="150" y="294" width="340" height="6" rx="3" fill="#334155"/>
  <rect x="150" y="294" width="190" height="6" rx="3" fill="url(#viCta)"><animate attributeName="width" values="0;240;0" dur="6s" repeatCount="indefinite"/></rect>

  <!-- controls -->
  <g transform="translate(150, 306)">
    <circle cx="10" cy="10" r="10" fill="#131c31" stroke="#334155"/>
    <rect x="7" y="7" width="6" height="6" fill="#fff"/>
    <rect x="40" y="6" width="60" height="8" rx="4" fill="#8457f6"/>
    <rect x="112" y="6" width="60" height="8" rx="4" fill="#2fd6b9"/>
    <rect x="184" y="6" width="60" height="8" rx="4" fill="#ea5fb0"/>
  </g>

  <!-- floating prompt card -->
  <rect x="20" y="170" width="140" height="70" rx="14" fill="#131c31" stroke="#8457f6" stroke-width="1" filter="url(#viGlow)"/>
  <rect x="36" y="188" width="100" height="8" rx="4" fill="#e2e8f0" opacity="0.7"/>
  <rect x="36" y="206" width="80" height="8" rx="4" fill="#64748b"/>
  <rect x="36" y="222" width="50" height="8" rx="4" fill="#2fd6b9"/>

  <!-- floating style selector -->
  <rect x="480" y="170" width="140" height="70" rx="14" fill="#131c31" stroke="#ea5fb0" stroke-width="1" filter="url(#viGlow)"/>
  <rect x="496" y="188" width="80" height="8" rx="4" fill="#e2e8f0" opacity="0.7"/>
  <rect x="496" y="206" width="60" height="8" rx="4" fill="#64748b"/>
  <rect x="496" y="222" width="90" height="8" rx="4" fill="url(#viTeal)"/>

  <!-- decorative sparkles -->
  <g filter="url(#viGlow)">
    <path d="M60 110l3 8 8 3-8 3-3 8-3-8-8-3 8-3z" fill="#2fd6b9"><animateTransform attributeName="transform" type="translate" values="0,0; 0,-8; 0,0" dur="2.6s" repeatCount="indefinite"/></path>
    <path d="M580 110l3 8 8 3-8 3-3 8-3-8-8-3 8-3z" fill="#ea5fb0"><animateTransform attributeName="transform" type="translate" values="0,0; 0,-8; 0,0" dur="2.6s" begin="0.7s" repeatCount="indefinite"/></path>
    <path d="M320 350l3 8 8 3-8 3-3 8-3-8-8-3 8-3z" fill="#8457f6"><animateTransform attributeName="transform" type="translate" values="0,0; 0,8; 0,0" dur="3s" repeatCount="indefinite"/></path>
  </g>

  <!-- bottom caption -->
  <rect x="220" y="338" width="200" height="12" rx="6" fill="#334155" opacity="0.5"/>
</svg>