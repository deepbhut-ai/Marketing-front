<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520" role="img" aria-label="MarketingIRA dashboard preview">
  <defs>
    <linearGradient id="hFrame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8457f6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ea5fb0" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="hCta" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8457f6"/>
      <stop offset="100%" stop-color="#ea5fb0"/>
    </linearGradient>
    <linearGradient id="hBar1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2fd6b9"/>
      <stop offset="100%" stop-color="#8457f6"/>
    </linearGradient>
    <linearGradient id="hBar2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ea5fb0"/>
      <stop offset="100%" stop-color="#f4485f"/>
    </linearGradient>
    <filter id="hGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- browser window -->
  <rect x="40" y="30" width="720" height="460" rx="22" fill="#111a2e" stroke="url(#hFrame)" stroke-width="2"/>
  <rect x="40" y="30" width="720" height="54" rx="22" fill="#161f35"/>
  <rect x="40" y="62" width="720" height="22" fill="#161f35"/>
  <circle cx="74" cy="57" r="7" fill="#f4485f"/>
  <circle cx="98" cy="57" r="7" fill="#facc15"/>
  <circle cx="122" cy="57" r="7" fill="#2fd6b9"/>
  <rect x="170" y="48" width="420" height="20" rx="10" fill="#223049"/>

  <!-- sidebar -->
  <rect x="62" y="106" width="148" height="360" rx="14" fill="#131c31"/>
  <circle cx="96" cy="140" r="18" fill="url(#hCta)"/>
  <rect x="126" y="132" width="64" height="10" rx="5" fill="#2fd6b9" opacity="0.9"/>
  <rect x="84" y="188" width="100" height="10" rx="5" fill="#334155"/>
  <rect x="84" y="214" width="76" height="10" rx="5" fill="#334155"/>
  <rect x="84" y="240" width="92" height="10" rx="5" fill="#334155"/>
  <rect x="84" y="266" width="60" height="10" rx="5" fill="#334155"/>

  <!-- top cards -->
  <rect x="230" y="106" width="238" height="118" rx="16" fill="#131c31" stroke="#223049" stroke-width="1"/>
  <rect x="252" y="128" width="44" height="44" rx="12" fill="#8457f6" opacity="0.18"/>
  <path d="M272 142v16" stroke="#2fd6b9" stroke-width="3" stroke-linecap="round"/>
  <path d="M264 150h16" stroke="#2fd6b9" stroke-width="3" stroke-linecap="round"/>
  <rect x="316" y="134" width="120" height="10" rx="5" fill="#e2e8f0" opacity="0.7"/>
  <rect x="316" y="156" width="80" height="10" rx="5" fill="#64748b"/>
  <rect x="252" y="192" width="194" height="14" rx="7" fill="url(#hCta)" opacity="0.85"/>

  <rect x="486" y="106" width="252" height="118" rx="16" fill="#131c31" stroke="#223049" stroke-width="1"/>
  <rect x="510" y="130" width="120" height="10" rx="5" fill="#e2e8f0" opacity="0.7"/>
  <rect x="510" y="152" width="86" height="28" rx="6" fill="#111a2e"/>
  <text x="520" y="171" font-family="Inter, sans-serif" font-size="14" fill="#fff" font-weight="600">24,592</text>
  <rect x="624" y="152" width="86" height="28" rx="6" fill="#111a2e"/>
  <text x="632" y="171" font-family="Inter, sans-serif" font-size="14" fill="#fff" font-weight="600">8,741</text>
  <rect x="510" y="196" width="70" height="8" rx="4" fill="#2fd6b9" opacity="0.8"/>
  <rect x="624" y="196" width="70" height="8" rx="4" fill="#ea5fb0" opacity="0.8"/>

  <!-- chart area -->
  <rect x="230" y="240" width="508" height="226" rx="16" fill="#131c31" stroke="#223049" stroke-width="1"/>
  <rect x="256" y="264" width="130" height="12" rx="6" fill="#e2e8f0" opacity="0.7"/>
  <rect x="624" y="262" width="90" height="24" rx="6" fill="url(#hCta)"/>
  <text x="636" y="278" font-family="Inter, sans-serif" font-size="11" fill="#fff" font-weight="600">Generate</text>

  <!-- bars -->
  <rect x="274" y="420" width="34" height="0" fill="url(#hBar1)" transform="scale(1,1) translate(0,0)" opacity="0"><animate attributeName="height" from="0" to="54" dur="1.4s" fill="freeze"/><animate attributeName="y" from="420" to="366" dur="1.4s" fill="freeze"/></rect>
  <rect x="324" y="420" width="34" height="0" fill="url(#hBar1)" opacity="0"><animate attributeName="height" from="0" to="88" dur="1.5s" fill="freeze"/><animate attributeName="y" from="420" to="332" dur="1.5s" fill="freeze"/></rect>
  <rect x="374" y="420" width="34" height="0" fill="url(#hBar2)" opacity="0"><animate attributeName="height" from="0" to="68" dur="1.6s" fill="freeze"/><animate attributeName="y" from="420" to="352" dur="1.6s" fill="freeze"/></rect>
  <rect x="424" y="420" width="34" height="0" fill="url(#hBar1)" opacity="0"><animate attributeName="height" from="0" to="118" dur="1.7s" fill="freeze"/><animate attributeName="y" from="420" to="302" dur="1.7s" fill="freeze"/></rect>
  <rect x="474" y="420" width="34" height="0" fill="url(#hBar2)" opacity="0"><animate attributeName="height" from="0" to="92" dur="1.8s" fill="freeze"/><animate attributeName="y" from="420" to="328" dur="1.8s" fill="freeze"/></rect>
  <rect x="524" y="420" width="34" height="0" fill="url(#hBar1)" opacity="0"><animate attributeName="height" from="0" to="132" dur="1.9s" fill="freeze"/><animate attributeName="y" from="420" to="288" dur="1.9s" fill="freeze"/></rect>
  <rect x="574" y="420" width="34" height="0" fill="url(#hBar2)" opacity="0"><animate attributeName="height" from="0" to="72" dur="2s" fill="freeze"/><animate attributeName="y" from="420" to="348" dur="2s" fill="freeze"/></rect>
  <rect x="624" y="420" width="34" height="0" fill="url(#hBar1)" opacity="0"><animate attributeName="height" from="0" to="106" dur="2.1s" fill="freeze"/><animate attributeName="y" from="420" to="314" dur="2.1s" fill="freeze"/></rect>
  <rect x="674" y="420" width="34" height="0" fill="url(#hBar2)" opacity="0"><animate attributeName="height" from="0" to="58" dur="2.2s" fill="freeze"/><animate attributeName="y" from="420" to="362" dur="2.2s" fill="freeze"/></rect>

  <!-- floating sparkles -->
  <g filter="url(#hGlow)">
    <path d="M196 330l4 12 12 4-12 4-4 12-4-12-12-4 12-4z" fill="#2fd6b9" opacity="0.9">
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,-12; 0,0" dur="4s" repeatCount="indefinite"/>
    </path>
    <path d="M690 160l3 9 9 3-9 3-3 9-3-9-9-3 9-3z" fill="#ea5fb0" opacity="0.9">
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,10; 0,0" dur="3.4s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>