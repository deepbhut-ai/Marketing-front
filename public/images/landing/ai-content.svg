<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-label="AI generated marketing content">
  <defs>
    <linearGradient id="acGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8457f6"/>
      <stop offset="100%" stop-color="#ea5fb0"/>
    </linearGradient>
    <linearGradient id="acTeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2fd6b9"/>
      <stop offset="100%" stop-color="#8457f6"/>
    </linearGradient>
    <filter id="acGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- central AI chip -->
  <rect x="220" y="120" width="200" height="160" rx="30" fill="#111a2e" stroke="url(#acGrad)" stroke-width="3" filter="url(#acGlow)"/>
  <circle cx="320" cy="180" r="28" fill="url(#acGrad)"/>
  <text x="320" y="187" text-anchor="middle" font-family="Space Grotesk, sans-serif" font-size="20" fill="#fff" font-weight="700">AI</text>
  <rect x="270" y="226" width="100" height="12" rx="6" fill="#2fd6b9" opacity="0.9"/>
  <rect x="290" y="246" width="60" height="8" rx="4" fill="#64748b"/>

  <!-- image card left -->
  <rect x="40" y="40" width="150" height="180" rx="18" fill="#131c31" stroke="#223049" stroke-width="1"/>
  <rect x="60" y="60" width="110" height="80" rx="10" fill="#161f35"/>
  <circle cx="92" cy="96" r="14" fill="url(#acGrad)" opacity="0.7"/>
  <polygon points="78,136 102,110 126,136" fill="#2fd6b9" opacity="0.5"/>
  <rect x="60" y="156" width="90" height="8" rx="4" fill="#e2e8f0" opacity="0.6"/>
  <rect x="60" y="172" width="60" height="8" rx="4" fill="#64748b"/>
  <rect x="60" y="188" width="70" height="8" rx="4" fill="#64748b"/>

  <!-- video card right -->
  <rect x="450" y="40" width="150" height="180" rx="18" fill="#131c31" stroke="#223049" stroke-width="1"/>
  <rect x="470" y="60" width="110" height="80" rx="10" fill="#161f35"/>
  <rect x="500" y="90" width="50" height="34" rx="8" fill="url(#acGrad)" opacity="0.8"/>
  <polygon points="516,101 516,113 528,107" fill="#fff"/>
  <rect x="470" y="156" width="90" height="8" rx="4" fill="#e2e8f0" opacity="0.6"/>
  <rect x="470" y="172" width="60" height="8" rx="4" fill="#64748b"/>
  <rect x="470" y="188" width="70" height="8" rx="4" fill="#64748b"/>

  <!-- text content card bottom -->
  <rect x="180" y="310" width="280" height="70" rx="16" fill="#131c31" stroke="#223049" stroke-width="1"/>
  <rect x="200" y="328" width="190" height="8" rx="4" fill="#e2e8f0" opacity="0.7"/>
  <rect x="200" y="344" width="160" height="8" rx="4" fill="#64748b"/>
  <rect x="200" y="360" width="120" height="8" rx="4" fill="#64748b"/>
  <rect x="410" y="328" width="34" height="34" rx="10" fill="url(#acTeal)"/>

  <!-- connection lines -->
  <path d="M190 130 C210 130, 220 160, 240 170" fill="none" stroke="#8457f6" stroke-width="2" stroke-dasharray="6 4" opacity="0.7"><animate attributeName="stroke-dashoffset" from="0" to="-20" dur="1.2s" repeatCount="indefinite"/></path>
  <path d="M450 130 C430 130, 420 160, 400 170" fill="none" stroke="#ea5fb0" stroke-width="2" stroke-dasharray="6 4" opacity="0.7"><animate attributeName="stroke-dashoffset" from="0" to="-20" dur="1.2s" repeatCount="indefinite"/></path>
  <path d="M320 280 L320 310" fill="none" stroke="#2fd6b9" stroke-width="2" stroke-dasharray="6 4" opacity="0.7"><animate attributeName="stroke-dashoffset" from="0" to="-20" dur="1.2s" repeatCount="indefinite"/></path>

  <!-- sparkles -->
  <g filter="url(#acGlow)">
    <path d="M130 240l3 8 8 3-8 3-3 8-3-8-8-3 8-3z" fill="#2fd6b9"><animateTransform attributeName="transform" type="translate" values="0,0; 0,-8; 0,0" dur="2.8s" repeatCount="indefinite"/></path>
    <path d="M510 240l3 8 8 3-8 3-3 8-3-8-8-3 8-3z" fill="#ea5fb0"><animateTransform attributeName="transform" type="translate" values="0,0; 0,-8; 0,0" dur="2.8s" begin="0.5s" repeatCount="indefinite"/></path>
    <path d="M320 30l3 8 8 3-8 3-3 8-3-8-8-3 8-3z" fill="#8457f6"><animateTransform attributeName="transform" type="translate" values="0,0; 0,8; 0,0" dur="3.2s" repeatCount="indefinite"/></path>
  </g>
</svg>