<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" role="img" aria-label="Auto post scheduling across social platforms">
  <defs>
    <linearGradient id="apCta" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8457f6"/>
      <stop offset="100%" stop-color="#ea5fb0"/>
    </linearGradient>
    <linearGradient id="apTeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2fd6b9"/>
      <stop offset="100%" stop-color="#8457f6"/>
    </linearGradient>
    <filter id="apGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- calendar body -->
  <rect x="170" y="40" width="300" height="340" rx="26" fill="#111a2e" stroke="#223049" stroke-width="2"/>
  <rect x="170" y="40" width="300" height="64" rx="26" fill="url(#apCta)"/>
  <rect x="170" y="74" width="300" height="30" fill="url(#apCta)"/>
  <text x="320" y="80" text-anchor="middle" font-family="Space Grotesk, sans-serif" font-size="18" fill="#fff" font-weight="700">Auto Schedule</text>

  <!-- month dots -->
  <g opacity="0.9">
    <rect x="204" y="118" width="28" height="28" rx="8" fill="#131c31"/>
    <rect x="250" y="118" width="28" height="28" rx="8" fill="#131c31"/>
    <rect x="296" y="118" width="28" height="28" rx="8" fill="#131c31"/>
    <rect x="342" y="118" width="28" height="28" rx="8" fill="#2fd6b9" filter="url(#apGlow)"/>
    <rect x="388" y="118" width="28" height="28" rx="8" fill="#131c31"/>
  </g>
  <g opacity="0.9">
    <rect x="204" y="158" width="28" height="28" rx="8" fill="#131c31"/>
    <rect x="250" y="158" width="28" height="28" rx="8" fill="#ea5fb0" filter="url(#apGlow)"/>
    <rect x="296" y="158" width="28" height="28" rx="8" fill="#131c31"/>
    <rect x="342" y="158" width="28" height="28" rx="8" fill="#131c31"/>
    <rect x="388" y="158" width="28" height="28" rx="8" fill="#131c31"/>
  </g>
  <g opacity="0.9">
    <rect x="204" y="198" width="28" height="28" rx="8" fill="#131c31"/>
    <rect x="250" y="198" width="28" height="28" rx="8" fill="#131c31"/>
    <rect x="296" y="198" width="28" height="28" rx="8" fill="#8457f6" filter="url(#apGlow)"/>
    <rect x="342" y="198" width="28" height="28" rx="8" fill="#131c31"/>
    <rect x="388" y="198" width="28" height="28" rx="8" fill="#131c31"/>
  </g>

  <!-- scheduled post card -->
  <rect x="204" y="250" width="232" height="96" rx="16" fill="#131c31" stroke="#334155" stroke-width="1"/>
  <rect x="220" y="268" width="64" height="64" rx="12" fill="#161f35"/>
  <circle cx="252" cy="292" r="12" fill="url(#apTeal)"/>
  <polygon points="247,292 252,300 259,286" fill="#fff"/>
  <rect x="296" y="272" width="110" height="8" rx="4" fill="#e2e8f0" opacity="0.7"/>
  <rect x="296" y="292" width="70" height="8" rx="4" fill="#64748b"/>
  <rect x="296" y="312" width="90" height="8" rx="4" fill="#2fd6b9" opacity="0.8"/>

  <!-- social icons around calendar -->
  <g transform="translate(40, 110)">
    <rect x="0" y="0" width="72" height="72" rx="18" fill="#131c31" stroke="#223049" stroke-width="1"/>
    <circle cx="36" cy="34" r="16" fill="#ea5fb0"/>
    <path d="M30 34h12M36 28v12" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
  </g>

  <g transform="translate(528, 110)">
    <rect x="0" y="0" width="72" height="72" rx="18" fill="#131c31" stroke="#223049" stroke-width="1"/>
    <circle cx="36" cy="34" r="16" fill="#8457f6"/>
    <path d="M28 34l6 6 12-12" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g transform="translate(40, 250)">
    <rect x="0" y="0" width="72" height="72" rx="18" fill="#131c31" stroke="#223049" stroke-width="1"/>
    <circle cx="36" cy="34" r="16" fill="#2fd6b9"/>
    <rect x="28" y="30" width="16" height="10" rx="3" fill="#111a2e"/>
  </g>

  <g transform="translate(528, 250)">
    <rect x="0" y="0" width="72" height="72" rx="18" fill="#131c31" stroke="#223049" stroke-width="1"/>
    <circle cx="36" cy="34" r="16" fill="#f4485f"/>
    <polygon points="30,38 36,28 42,38" fill="#fff"/>
  </g>

  <!-- orbit paths -->
  <path d="M112 146 C130 146, 160 120, 180 110" fill="none" stroke="#8457f6" stroke-width="2" stroke-dasharray="5 4" opacity="0.6"><animate attributeName="stroke-dashoffset" from="0" to="-18" dur="1.2s" repeatCount="indefinite"/></path>
  <path d="M528 146 C510 146, 480 120, 460 110" fill="none" stroke="#ea5fb0" stroke-width="2" stroke-dasharray="5 4" opacity="0.6"><animate attributeName="stroke-dashoffset" from="0" to="-18" dur="1.2s" repeatCount="indefinite"/></path>
  <path d="M112 286 C130 286, 160 300, 180 310" fill="none" stroke="#2fd6b9" stroke-width="2" stroke-dasharray="5 4" opacity="0.6"><animate attributeName="stroke-dashoffset" from="0" to="-18" dur="1.2s" repeatCount="indefinite"/></path>
  <path d="M528 286 C510 286, 480 300, 460 310" fill="none" stroke="#f4485f" stroke-width="2" stroke-dasharray="5 4" opacity="0.6"><animate attributeName="stroke-dashoffset" from="0" to="-18" dur="1.2s" repeatCount="indefinite"/></path>

  <!-- clock floating -->
  <g transform="translate(560, 30)" filter="url(#apGlow)">
    <circle cx="30" cy="30" r="26" fill="#111a2e" stroke="url(#apCta)" stroke-width="2"/>
    <path d="M30 30 L30 16" stroke="#fff" stroke-width="3" stroke-linecap="round"><animateTransform attributeName="transform" type="rotate" from="0 30 30" to="360 30 30" dur="12s" repeatCount="indefinite"/></path>
    <path d="M30 30 L40 30" stroke="#fff" stroke-width="3" stroke-linecap="round"><animateTransform attributeName="transform" type="rotate" from="0 30 30" to="360 30 30" dur="2s" repeatCount="indefinite"/></path>
  </g>

  <!-- bottom line -->
  <rect x="230" y="395" width="180" height="10" rx="5" fill="#334155" opacity="0.5"/>
</svg>